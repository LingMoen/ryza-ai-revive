name: Build Ryza Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Download original release APK
        shell: bash
        run: |
          set -e

          URL="https://github.com/zeroa234/ryza-ai-revive/releases/download/v1.2.15/RyzaChat-1.2.15.apk"

          curl -L \
            --fail \
            --retry 3 \
            -o RyzaChat-1.2.15.apk \
            "$URL"

          ls -lh RyzaChat-1.2.15.apk

      - name: Restore original media
        shell: bash
        run: |
          set -e

          python scripts/restore_media.py RyzaChat-1.2.15.apk

          echo ""
          echo "Checking restored media..."

          find web/assets \
            \( -name "*.png" \
            -o -name "*.jpg" \
            -o -name "*.webp" \
            -o -name "*.m4a" \
            -o -name "*.mp3" \
            -o -name "*.wav" \
            -o -name "*.ogg" \
            -o -name "*.skel" \
            -o -name "*.ttf" \
            -o -name "*.otf" \) \
            -type f | wc -l

      - name: Prepare Android assets
        shell: bash
        run: |
          set -e

          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets

          rsync -a \
            --exclude="assets/" \
            web/ \
            android/app/src/main/assets/

          rsync -a \
            web/assets/ \
            android/app/src/main/assets/

          echo ""
          echo "Prepared asset size:"
          du -sh android/app/src/main/assets

      - name: Build APK
        working-directory: android
        run: |
          gradle \
            --no-daemon \
            clean \
            assembleDebug

      - name: Show APK size
        shell: bash
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"
          du -h "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RyzaChat-full-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
