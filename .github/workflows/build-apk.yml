name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Android SDK tools (aapt2, zipalign, apksigner)
        run: |
          # 安装所需的 Android 构建工具
          echo "y" | sdkmanager "build-tools;34.0.0"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Run build script
        run: |
          # 根据项目根目录下的 PowerShell 脚本逻辑，改写为 shell 执行
          python scripts/pack_apk_assets.py
          # 依次执行 javac, d8, aapt2, zipalign, apksigner (需根据 build.ps1 补全)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/outputs/apk/app-release-unsigned.apk
