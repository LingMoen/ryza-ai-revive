name: Build Ryza APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Android toolchain
        shell: pwsh
        run: |
          ./scripts/setup_android_tools.ps1

      - name: Verify Android toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $root = $PWD
          $sdk = Join-Path $root ".android-tools\android-sdk"
          $jdk = Join-Path $root ".android-tools\jdk17"
          $bt = Join-Path $sdk "build-tools\34.0.0"

          Write-Host "JDK:"
          Get-ChildItem (Join-Path $jdk "bin") | Select-Object Name

          Write-Host "`nBuild Tools:"
          Get-ChildItem $bt | Select-Object Name

          $required = @(
            (Join-Path $jdk "bin\javac.exe"),
            (Join-Path $sdk "platforms\android-34\android.jar"),
            (Join-Path $bt "aapt2.exe"),
            (Join-Path $bt "aapt.exe"),
            (Join-Path $bt "d8.bat"),
            (Join-Path $bt "zipalign.exe"),
            (Join-Path $bt "apksigner.bat")
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Missing required Android build tool: $file"
            }

            Write-Host "OK: $file"
          }

      - name: Build APK
        shell: pwsh
        run: |
          ./scripts/build_apk.ps1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RyzaChat-APK
          path: output/android/*.apk
          if-no-files-found: error
          retention-days: 7
