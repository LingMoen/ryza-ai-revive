name: Build Ryza APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Android build tools
        shell: pwsh
        run: |
          ./scripts/setup_android_tools.ps1

      - name: Build APK
        shell: pwsh
        run: |
          ./scripts/build_apk.ps1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RyzaChat-APK
          path: output/android/*.apk
          if-no-files-found: error
          retention-days: 7
