name: Build Ryza Chat APK

on:
  workflow_dispatch:

  push:
    branches:
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4


      - name: Install Android SDK packages
        run: |
          set -e

          sdkmanager "platforms;android-34" \
                     "build-tools;34.0.0"

          yes | sdkmanager --licenses > /dev/null || true


      # ============================================================
      # GRADLE
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"


      # ============================================================
      # VERIFY SOURCE
      # ============================================================
      - name: Verify Ryza source
        run: |
          set -e

          echo "Checking Ryza source..."

          test -f web/index.html
          test -f web/js/app.js
          test -f web/js/api.js
          test -f web/js/config.js

          echo "Checking world index..."

          test -f web/assets/_index/scenes.json
          test -f web/assets/_index/voice_bank.json
          test -f web/assets/_index/world_hierarchy.json
          test -f web/assets/_index/npc_placement.json
          test -f web/assets/_index/stage_background_map.json

          echo "Ryza source verification PASSED."


      # ============================================================
      # VERIFY FISH AUDIO
      # ============================================================
      - name: Verify Fish Audio support
        run: |
          set -e

          echo "Checking Fish Audio support..."

          grep -qi "fish" web/js/app.js
          grep -qi "fishaudio" web/js/api.js
          grep -qi "fishaudio-s21pro-flash" web/js/config.js

          echo "Fish Audio verification PASSED."


      # ============================================================
      # PREPARE ANDROID ASSETS
      # ============================================================
      - name: Prepare Android assets
        run: |
          set -e

          echo "Preparing Android assets..."

          rm -rf android/app/src/main/assets

          mkdir -p android/app/src/main/assets

          # Copy web files except web/assets
          rsync -a \
            --exclude="assets/" \
            web/ \
            android/app/src/main/assets/

          # Flatten web/assets into Android assets root
          rsync -a \
            web/assets/ \
            android/app/src/main/assets/

          echo ""
          echo "Checking staged assets..."

          test -f android/app/src/main/assets/index.html
          test -f android/app/src/main/assets/js/app.js
          test -f android/app/src/main/assets/js/api.js
          test -f android/app/src/main/assets/js/config.js

          test -f android/app/src/main/assets/_index/scenes.json
          test -f android/app/src/main/assets/_index/voice_bank.json
          test -f android/app/src/main/assets/_index/world_hierarchy.json
          test -f android/app/src/main/assets/_index/npc_placement.json
          test -f android/app/src/main/assets/_index/stage_background_map.json

          echo ""
          echo "IMPORTANT _index files:"
          find android/app/src/main/assets/_index -maxdepth 1 -type f

          echo ""
          echo "Android assets prepared successfully."


      # ============================================================
      # SHOW GRADLE CONFIG
      # ============================================================
      - name: Show Android configuration
        run: |
          echo "========================================"
          echo "BUILD.GRADLE"
          echo "========================================"

          cat android/app/build.gradle

          echo ""
          echo "========================================"
          echo "ASSET DIRECTORY"
          echo "========================================"

          find android/app/src/main/assets \
            -maxdepth 2 \
            -type f | head -100


      # ============================================================
      # BUILD APK
      # ============================================================
      - name: Build debug APK
        working-directory: android
        run: |
          set -e

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug


      # ============================================================
      # VERIFY APK
      # ============================================================
      - name: Verify APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          echo "========================================"
          echo "APK CREATED"
          echo "========================================"

          test -f "$APK"

          ls -lh "$APK"


          # --------------------------------------------------------
          # BASIC ASSETS
          # --------------------------------------------------------
          echo ""
          echo "========================================"
          echo "CHECKING BASIC ASSETS"
          echo "========================================"

          unzip -l "$APK" | grep -F "assets/index.html"
          unzip -l "$APK" | grep -F "assets/js/app.js"
          unzip -l "$APK" | grep -F "assets/js/api.js"
          unzip -l "$APK" | grep -F "assets/js/config.js"


          # --------------------------------------------------------
          # WORLD INDEX
          # --------------------------------------------------------
          echo ""
          echo "========================================"
          echo "CHECKING WORLD INDEX"
          echo "========================================"

          unzip -l "$APK" | grep -F "assets/_index/scenes.json"
          unzip -l "$APK" | grep -F "assets/_index/voice_bank.json"
          unzip -l "$APK" | grep -F "assets/_index/world_hierarchy.json"
          unzip -l "$APK" | grep -F "assets/_index/npc_placement.json"
          unzip -l "$APK" | grep -F "assets/_index/stage_background_map.json"


          # --------------------------------------------------------
          # MAKE SURE DOUBLE ASSETS PATH DOES NOT EXIST
          # --------------------------------------------------------
          echo ""
          echo "========================================"
          echo "CHECKING ASSET PATH"
          echo "========================================"

          if unzip -l "$APK" | grep -qF "assets/assets/_index/"; then
            echo "ERROR: Wrong assets/assets/_index path detected!"
            exit 1
          fi

          echo "Asset path is correct."


          # --------------------------------------------------------
          # FISH AUDIO
          # --------------------------------------------------------
          echo ""
          echo "========================================"
          echo "CHECKING FISH AUDIO"
          echo "========================================"

          unzip -p "$APK" assets/js/app.js | grep -qi "fish"
          unzip -p "$APK" assets/js/api.js | grep -qi "fishaudio"
          unzip -p "$APK" assets/js/config.js | grep -qi "fishaudio-s21pro-flash"

          echo "Fish Audio code found in APK."


          # --------------------------------------------------------
          # APK SIGNATURE
          # --------------------------------------------------------
          echo ""
          echo "========================================"
          echo "CHECKING APK SIGNATURE"
          echo "========================================"

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify \
            --verbose \
            "$APK"

          echo ""
          echo "========================================"
          echo "APK VERIFICATION PASSED"
          echo "========================================"


      # ============================================================
      # UPLOAD FINAL APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RyzaChat-1.2.15-Fish-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
